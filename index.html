<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Master Astrox — Luận Giải Vận Mệnh</title>
<style>
/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0b0a0f;
  --bg2:       #12101a;
  --surface:   #1a1726;
  --border:    rgba(180,140,255,0.15);
  --border2:   rgba(180,140,255,0.28);
  --gold:      #c9a84c;
  --gold2:     #e8c97a;
  --violet:    #9b72cf;
  --violet2:   #c4a0f5;
  --crimson:   #c0392b;
  --teal:      #2ec4b6;
  --text:      #e8e0f0;
  --text2:     #a090c0;
  --text3:     #6a5a8a;
  --radius:    10px;
  --glow-gold: 0 0 24px rgba(201,168,76,0.35);
  --glow-v:    0 0 24px rgba(155,114,207,0.35);
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, 'Arial Unicode MS', sans-serif;
  font-size: 15px;
  line-height: 1.75;
  min-height: 100vh;
  overflow-x: hidden;
}

#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.55;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 860px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ── HEADER ── */
header {
  text-align: center;
  padding: 64px 0 48px;
}

.header-sigil {
  font-size: 44px;
  display: block;
  margin-bottom: 20px;
  animation: float 6s ease-in-out infinite;
  filter: drop-shadow(0 0 16px rgba(201,168,76,0.6));
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

.logo {
  font-family: Arial Black, Arial, sans-serif;
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--gold) 0%, var(--violet2) 50%, var(--gold2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(201,168,76,0.4));
  margin-bottom: 10px;
}

.tagline {
  color: var(--text2);
  font-size: 13px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.header-rule {
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: 480px;
  margin: 0 auto;
}
.header-rule span { flex:1; height:1px; background: linear-gradient(to right, transparent, var(--border2), transparent); }
.header-rule em   { color: var(--gold); font-style: normal; font-size: 18px; }

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 40px;
  margin-bottom: 32px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--violet), var(--gold), transparent);
}

.card-title {
  font-family: Arial Black, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title::after { content:''; flex:1; height:1px; background: var(--border); }

/* ── FORM ── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px 24px;
}
.form-grid .full { grid-column: 1 / -1; }

.field label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text2);
  margin-bottom: 7px;
}
.field label .req { color: var(--crimson); margin-left: 3px; }
.field label .opt { color: var(--text3); font-size: 10px; margin-left: 4px; text-transform: none; letter-spacing: 0; }

.field input,
.field select {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 14px;
  color: var(--text);
  font-family: Arial, sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s;
  appearance: none;
  -webkit-appearance: none;
}
.field input:focus,
.field select:focus {
  border-color: var(--violet);
  box-shadow: var(--glow-v);
}
.field input::placeholder { color: var(--text3); }
.field select option { background: var(--bg2); color: var(--text); }

.select-wrap { position: relative; }
.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text2);
  pointer-events: none;
  font-size: 12px;
}

/* ── NUMEROLOGY HELPER ── */
.num-helper {
  background: rgba(155,114,207,0.08);
  border: 1px solid rgba(155,114,207,0.2);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-top: 20px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  display: none;
}
.num-helper strong { color: var(--violet2); }
.num-result { font-size: 22px; font-weight: bold; color: var(--gold2); margin-top: 4px; }

/* ── SUBMIT ── */
.submit-wrap { text-align: center; margin-top: 32px; }

.btn-submit {
  background: linear-gradient(135deg, var(--gold) 0%, #b8860b 40%, var(--violet) 100%);
  border: none;
  border-radius: 50px;
  padding: 16px 56px;
  color: #fff;
  font-family: Arial Black, Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 24px rgba(155,114,207,0.35);
}
.btn-submit:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(155,114,207,0.5);
}
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── LOADING ── */
.loading-wrap { display: none; text-align: center; padding: 80px 0; }
.loading-wrap.visible { display: block; }

.orb {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--violet2), var(--violet), #3d1f6e);
  margin: 0 auto 28px;
  box-shadow: 0 0 40px rgba(155,114,207,0.6);
  animation: orbPulse 2s ease-in-out infinite;
}
@keyframes orbPulse {
  0%,100% { transform: scale(1);    box-shadow: 0 0 40px rgba(155,114,207,0.6); }
  50%      { transform: scale(1.12); box-shadow: 0 0 64px rgba(155,114,207,0.9); }
}

.loading-text {
  color: var(--text2);
  font-size: 14px;
  letter-spacing: 0.1em;
  animation: fadeText 2.8s ease-in-out infinite;
}
@keyframes fadeText {
  0%,100% { opacity: 0.4; }
  50%      { opacity: 1; }
}

/* ── READING ── */
.reading-wrap { display: none; }
.reading-wrap.visible { display: block; }

.reading-header {
  text-align: center;
  padding: 40px 0 32px;
}
.reading-name {
  font-family: Arial Black, Arial, sans-serif;
  font-size: clamp(20px, 4vw, 32px);
  letter-spacing: 0.08em;
  color: var(--gold2);
  text-shadow: var(--glow-gold);
  margin-bottom: 8px;
}
.reading-meta { color: var(--text2); font-size: 13px; letter-spacing: 0.06em; }

/* tabs */
.section-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
  justify-content: center;
}
.tab-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 7px 18px;
  color: var(--text2);
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 0.07em;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn:hover  { border-color: var(--violet); color: var(--violet2); }
.tab-btn.active { background: linear-gradient(135deg, rgba(155,114,207,0.25), rgba(201,168,76,0.15)); border-color: var(--violet); color: var(--gold2); }

/* panels */
.section-panel { display: none; }
.section-panel.active { display: block; animation: fadeUp 0.4s ease both; }
@keyframes fadeUp {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}

.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 36px;
  position: relative;
  overflow: hidden;
}
.section-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}
.section-card[data-color="gold"]::before    { background: linear-gradient(90deg, transparent, var(--gold),    transparent); }
.section-card[data-color="violet"]::before  { background: linear-gradient(90deg, transparent, var(--violet2), transparent); }
.section-card[data-color="teal"]::before    { background: linear-gradient(90deg, transparent, var(--teal),    transparent); }
.section-card[data-color="crimson"]::before { background: linear-gradient(90deg, transparent, #e74c3c,        transparent); }

.section-icon    { font-size: 30px; margin-bottom: 12px; display: block; }
.section-heading {
  font-family: Arial Black, Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-heading::after { content:''; flex:1; height:1px; background: var(--border); }

.section-body {
  color: var(--text);
  font-size: 15px;
  line-height: 1.95;
}
.section-body p           { margin-bottom: 14px; }
.section-body p:last-child { margin-bottom: 0; }
.section-body strong { color: var(--gold2); }
.section-body em     { color: var(--violet2); }

/* reset btn */
.reset-wrap { text-align: center; margin-top: 40px; }
.btn-reset {
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 50px;
  padding: 12px 36px;
  color: var(--text2);
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-reset:hover { border-color: var(--gold); color: var(--gold); }

/* error */
.error-msg {
  display: none;
  background: rgba(192,57,43,0.15);
  border: 1px solid rgba(192,57,43,0.4);
  border-radius: var(--radius);
  padding: 14px 18px;
  color: #e8a0a0;
  font-size: 13px;
  margin-top: 18px;
  text-align: center;
  line-height: 1.6;
}

footer {
  text-align: center;
  padding: 32px 0 16px;
  color: var(--text3);
  font-size: 11px;
  letter-spacing: 0.1em;
}

@media (max-width: 600px) {
  .card { padding: 24px 18px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .full { grid-column: 1; }
  .section-card { padding: 22px 18px; }
}
</style>
</head>
<body>

<script>
// ── API KEY ────────────────────────────────────────────────
const GEMINI_API_KEY = 'AIzaSyB07bYBTNs5-k88i-L7hGpvWDeaxWvtm7k';
const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;

// ── STARS CANVAS ───────────────────────────────────────────
(function() {
  const cv = document.getElementById('bgCanvas');
  const cx = cv.getContext('2d');
  let stars = [];
  function resize() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  function seed() {
    stars = Array.from({length:130}, () => ({
      x: Math.random()*cv.width, y: Math.random()*cv.height,
      r: Math.random()*1.4+0.3,
      a: Math.random(), da: (Math.random()-0.5)*0.007,
      c: Math.random()>0.65 ? '#c9a84c' : '#c4a0f5'
    }));
  }
  function draw() {
    cx.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a<=0.05||s.a>=1) s.da*=-1;
      cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2);
      cx.fillStyle=s.c; cx.globalAlpha=s.a*0.65; cx.fill();
    });
    cx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  resize(); seed(); draw();
  window.addEventListener('resize',()=>{resize();seed();});
})();

// ── AUTO-CALC: CHINESE ZODIAC ─────────────────────────────
const CZ = ['Thân','Dậu','Tuất','Hợi','Tý','Sửu','Dần','Mão','Thìn','Tị','Ngọ','Mùi'];
const CZ_EN = ['Monkey','Rooster','Dog','Pig','Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat'];
function chineseZodiac(y) {
  const i = ((y-1980)%12+12)%12;
  return CZ[i]+' ('+CZ_EN[i]+')';
}

// ── AUTO-CALC: WESTERN SIGN ───────────────────────────────
function westernSign(m, d) {
  const cuts = [[1,20,'Aquarius ♒'],[2,19,'Pisces ♓'],[3,21,'Aries ♈'],[4,20,'Taurus ♉'],
    [5,21,'Gemini ♊'],[6,21,'Cancer ♋'],[7,23,'Leo ♌'],[8,23,'Virgo ♍'],
    [9,23,'Libra ♎'],[10,23,'Scorpio ♏'],[11,22,'Sagittarius ♐'],[12,22,'Capricorn ♑']];
  for (const [cm,cd,name] of cuts) if (m<cm||(m===cm&&d<cd)) return name;
  return 'Capricorn ♑';
}

// ── AUTO-CALC: LIFE PATH ──────────────────────────────────
function lifePath(dobStr) {
  const digits = dobStr.replace(/-/g,'').split('').map(Number);
  let sum = digits.reduce((a,b)=>a+b,0);
  let steps = digits.join('+')+'='+sum;
  while(sum>9&&sum!==11&&sum!==22&&sum!==33){
    const d=String(sum).split('').map(Number);
    const n=d.reduce((a,b)=>a+b,0);
    steps+=' → '+d.join('+')+' = '+n;
    sum=n;
  }
  return {number:sum, steps};
}

// ── DOB CHANGE HANDLER ────────────────────────────────────
document.getElementById('dob').addEventListener('change', function() {
  const val = this.value; if(!val) return;
  const [y,m,d] = val.split('-').map(Number);

  document.getElementById('chineseZodiac').value = chineseZodiac(y);

  // auto-set western sign only if user hasn't chosen manually
  const wSel = document.getElementById('westernSign');
  if (!wSel.value) {
    const auto = westernSign(m,d);
    for (const o of wSel.options) { if (o.text.startsWith(auto.split(' ')[0])) { wSel.value = o.text; break; } }
  }

  const lp = lifePath(val);
  document.getElementById('lifePathNum').value = lp.number;
  document.getElementById('numCalcShow').textContent = lp.steps;
  document.getElementById('numResult').textContent   = 'Life Path ' + lp.number;
  document.getElementById('numHelper').style.display = 'block';
});

  {id:'strengths',   icon:'⚡', label:'Điểm Mạnh',   color:'violet',  title:'Điểm Mạnh & Thử Thách'},
  {id:'career',      icon:'🎯', label:'Sự Nghiệp',   color:'teal',    title:'Sự Nghiệp & Mục Đích'},
  {id:'love',        icon:'❤️', label:'Tình Cảm',    color:'crimson', title:'Tình Cảm & Các Mối Quan Hệ'},
  {id:'wealth',      icon:'💰', label:'Tài Lộc',     color:'gold',    title:'Tài Lộc & Vận May'},
  {id:'health',      icon:'🌿', label:'Sức Khỏe',    color:'teal',    title:'Sức Khỏe & Năng Lượng'},
  {id:'timing',      icon:'🌙', label:'Chu Kỳ',      color:'violet',  title:'Giai Đoạn & Thời Điểm'},
];

// ── BUILD PROMPT ──────────────────────────────────────────
function buildPrompt(d) {
  return `Bạn là Master Astrox — bậc thầy uyên bác về luận giải vận mệnh, kết hợp sáu hệ thống: Chiêm tinh Tây Phương (Western Astrology), Tử Vi Đẩu Số, Bát Tự / Tứ Trụ, Ngũ Hành, Địa Chi & Thiên Can, và Thần Số Học (Numerology).

THÔNG TIN NGƯỜI ĐƯỢC LUẬN GIẢI:
- Họ tên: ${d.fullName}
- Ngày sinh: ${d.dob}
- Giờ sinh: ${d.tob||'Không rõ'}

// ── PARSE SECTIONS ────────────────────────────────────────
function parseSections(text) {
  const out = {};
  SECTIONS.forEach(({id}, i) => {
    const tag   = `[SECTION:${id}]`;
    const start = text.indexOf(tag);
    if (start===-1) { out[id]=''; return; }
    let end = text.length;
    for (let j=i+1;j<SECTIONS.length;j++) {
      const nTag = `[SECTION:${SECTIONS[j].id}]`;
      const ni   = text.indexOf(nTag);
      if (ni!==-1&&ni<end) end=ni;
    }
    out[id] = text.slice(start+tag.length, end).trim();
  });
  return out;
}

// ── LOADING MESSAGES ──────────────────────────────────────
const MSGS = [
  'Master Astrox đang đọc lá số của bạn...',
  'Phân tích Tứ Trụ & Ngũ Hành...',
  'Khảo sát các cung Tử Vi Đẩu Số...',
  'Kết hợp Western Astrology & Numerology...',
  'Dệt nên bức chân dung vận mệnh...',
  'Gần xong rồi...',
];
let msgTimer;
function startMsgs() {
  let i=0;
  document.getElementById('loadingText').textContent = MSGS[0];
  msgTimer = setInterval(()=>{ i=(i+1)%MSGS.length; document.getElementById('loadingText').textContent=MSGS[i]; }, 2800);
}
function stopMsgs() { clearInterval(msgTimer); }

// ── GENERATE ──────────────────────────────────────────────
async function generateReading() {
  const fullName = document.getElementById('fullName').value.trim();
  const dob      = document.getElementById('dob').value;
  const pob      = document.getElementById('pob').value.trim();

  if (!fullName||!dob||!pob) {
    showError('Vui lòng điền đầy đủ: Họ tên, Ngày sinh và Nơi sinh.');
    return;
  }

  const [y,m,d2] = dob.split('-').map(Number);
  const wSignSel = document.getElementById('westernSign').value;

  const data = {
    fullName,
    dob,
    tob:           document.getElementById('tob').value,
    pob,
    westernSign:   wSignSel || westernSign(m,d2),
    risingSign:    document.getElementById('risingSign').value,
    chineseZodiac: document.getElementById('chineseZodiac').value || chineseZodiac(y),
    lifePathNum:   document.getElementById('lifePathNum').value || lifePath(dob).number,
  };

  document.getElementById('formSection').style.display  = 'none';
  document.getElementById('loadingWrap').classList.add('visible');
  document.getElementById('readingWrap').classList.remove('visible');
  startMsgs();

  try {
    const res = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: [{parts:[{text: buildPrompt(data)}]}],
        generationConfig: { temperature: 0.82, maxOutputTokens: 3200 }
      })
    });

    if (!res.ok) {
      const e = await res.json().catch(()=>({}));
      throw new Error(e?.error?.message || 'HTTP ' + res.status);
    }

    const json    = await res.json();
    const rawText = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
    if (!rawText) throw new Error('Không nhận được phản hồi từ AI.');

    stopMsgs();
    renderReading(data, parseSections(rawText));

  } catch(err) {
    stopMsgs();
    document.getElementById('loadingWrap').classList.remove('visible');
    document.getElementById('formSection').style.display = 'block';
    showError('Có lỗi: ' + err.message);
    console.error(err);
  }
}

// ── RENDER ────────────────────────────────────────────────
function renderReading(data, sections) {
  document.getElementById('loadingWrap').classList.remove('visible');

  const [y,m,d] = data.dob.split('-');
  document.getElementById('readingName').textContent = data.fullName;
  document.getElementById('readingMeta').textContent =
    `${d}/${m}/${y}  ·  ${data.pob}  ·  ${data.westernSign}  ·  ${data.chineseZodiac}`;

  const tabsEl   = document.getElementById('sectionTabs');
  const panelsEl = document.getElementById('sectionPanels');
  tabsEl.innerHTML = ''; panelsEl.innerHTML = '';

  SECTIONS.forEach(({id,icon,label,color,title}, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i===0?' active':'');
    btn.innerHTML = icon+' '+label;
    btn.onclick = () => switchTab(id);
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'section-panel'+(i===0?' active':'');
    panel.id = 'panel-'+id;
    panel.innerHTML = `
      <div class="section-card" data-color="${color}">
        <span class="section-icon">${icon}</span>
        <div class="section-heading">${title}</div>
        <div class="section-body">${renderBody(sections[id]||'Không có dữ liệu.')}</div>
      </div>`;
    panelsEl.appendChild(panel);
  });

  document.getElementById('readingWrap').classList.add('visible');
  setTimeout(()=>document.getElementById('readingWrap').scrollIntoView({behavior:'smooth'}),100);
}

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', SECTIONS[i].id===id));
  document.querySelectorAll('.section-panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
}

function renderBody(text) {
  // Convert markdown bold/italic then wrap paragraphs
  const safe = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>');
  return safe.split(/\n\n+/).filter(p=>p.trim()).map(p=>`<p>${p.replace(/\n/g,'<br/>')}</p>`).join('');
}

// ── HELPERS ───────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display='block';
  setTimeout(()=>el.style.display='none', 6000);
}

function resetForm() {
  document.getElementById('readingWrap').classList.remove('visible');
  document.getElementById('formSection').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}
